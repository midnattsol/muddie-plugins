# The gauges of Reinos de Leyenda, for what is urgent in a fight. In
# Puntos, life, energy, and faith for a character who has it, all alike:
# green, yellow under 60 %, red under 30 %, a whole bar. The states the
# character is in are shown by reinos.luau, in Efectos.
#
# Life says nothing itself: life.luau says it as it falls under half, 30 %
# and 10 %, and how much was lost or gained, so that nothing is said twice
# and it can be switched off alone. Energy and faith wait their turn.

[[gauge]]
name = "Vida"
value = "Char.Status.pvs.min"
max = "Char.Status.pvs.max"
colour = "#5fb85f"
kind = "bar"
steps = [{ under = 60, colour = "#e0c040" }, { under = 30, colour = "#e05050" }]
aloud = "never"
panel = "Puntos"

[[gauge]]
name = "Energía"
value = "Char.Status.pe.min"
max = "Char.Status.pe.max"
colour = "#5fb85f"
kind = "bar"
steps = [{ under = 60, colour = "#e0c040" }, { under = 30, colour = "#e05050" }]
aloud = "wait"
panel = "Puntos"

[[gauge]]
name = "Fe"
value = "Char.Status.fe.min"
max = "Char.Status.fe.max"
colour = "#5fb85f"
kind = "bar"
steps = [{ under = 60, colour = "#e0c040" }, { under = 30, colour = "#e05050" }]
aloud = "wait"
panel = "Puntos"
